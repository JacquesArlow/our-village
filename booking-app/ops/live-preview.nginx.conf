location = /booking {
  return 302 /booking/;
}

location = /village-desk {
  add_header X-Robots-Tag "noindex, nofollow" always;
  return 302 /village-desk/;
}

# The existing events and day views continue to the website's default upstream.
location ~ ^/village-desk/(?!events(?:/|$)|day(?:/|$)) {
  if ($host != "www.our-village.co.za") {
    return 302 https://www.our-village.co.za$request_uri;
  }
  client_max_body_size 32k;
  proxy_pass http://127.0.0.1:8197;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 30s;
}

location ^~ /booking/ {
  if ($host != "www.our-village.co.za") {
    return 302 https://www.our-village.co.za$request_uri;
  }
  client_max_body_size 32k;
  proxy_pass http://127.0.0.1:8195;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 30s;
}
