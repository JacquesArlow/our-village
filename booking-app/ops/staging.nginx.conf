server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  ssl_certificate_key /etc/nginx/ssl-certificates/staging.our-village.co.za.key;
  ssl_certificate /etc/nginx/ssl-certificates/staging.our-village.co.za.crt;
  server_name staging.our-village.co.za;
  include /etc/nginx/cloudflare/cf-realip.conf;
  if ($cf_origin_ok = 0) { return 403; }
  if ($scheme != "https") { return 301 https://$host$request_uri; }

  auth_basic "Our Village Booking Staging";
  auth_basic_user_file /home/ourvillage-stg/.htpasswd;
  client_max_body_size 64k;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Cache-Control "private, no-store" always;

  # Yoco cannot authenticate with an interactive Nginx password. Only this
  # exact POST endpoint is exempt; the application verifies HMAC signatures,
  # timestamps, test mode, checkout ID, amount, currency and duplicate events.
  location = /api/payments/yoco/webhook {
    auth_basic off;
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8093;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30;
  }
  location / {
    proxy_pass http://127.0.0.1:8093;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60;
  }
}
