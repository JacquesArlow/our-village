services:
  web:
    image: ourvillage-booking-staging:latest
    container_name: ourvillage-booking-preview
    restart: unless-stopped
    ports:
      - "127.0.0.1:8195:3000"
    env_file:
      - ../.env.booking-preview
    environment:
      APP_MODE: live-preview
      NODE_ENV: production
      NUXT_APP_BASE_URL: /booking/
      NUXT_PUBLIC_BOOKING_LOGIN_REQUIRED: "true"
      BETTER_AUTH_URL: https://www.our-village.co.za
      BOOKING_DATABASE_PATH: /data/bookings.db
      EMAIL_MODE: "off"
      ENABLE_STAGING_SIMULATIONS: "true"
      YOCO_SECRET_KEY: ""
      YOCO_WEBHOOK_SECRET: ""
    volumes:
      - booking_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/booking/api/health').then(r=>r.json()).then(x=>process.exit(x.ok && x.mode==='live-preview'?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 4
volumes:
  booking_data:
