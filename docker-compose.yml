services:
  web:
    build: .
    image: ${IMAGE_NAME:-ourvillage-web}:latest
    container_name: ${CONTAINER_NAME:-ourvillage-web}
    restart: unless-stopped
    # Bind to localhost only; the host nginx reverse-proxies to this port.
    # HOST_PORT defaults to 8090 (prod-preview); staging deploy overrides to 8093.
    ports:
      - "127.0.0.1:${HOST_PORT:-8090}:3000"
    environment:
      - NODE_ENV=production
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
      # SQLite (libSQL) lives on the mounted volume so it survives rebuilds.
      - DATABASE_URL=file:/data/ourvillage.db
      # Auth + admin seed are supplied via the host .env file (never committed).
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://staging.our-village.co.za}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - ADMIN_SEED_EMAIL=${ADMIN_SEED_EMAIL}
      - ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD}
      # Cloudflare Turnstile SECRET (server-side verify) — from host .env, never committed.
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      # Contact form email via Brevo SMTP relay — all from host .env, never committed.
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - CONTACT_TO=${CONTACT_TO:-reception@our-village.co.za}
      - CONTACT_FROM=${CONTACT_FROM:-Our Village Website <reception@our-village.co.za>}
      # WhatsApp — set the real wa.me number (27XXXXXXXXX) here.
      # The link builder appends ?text= automatically.
      - NUXT_PUBLIC_WHATSAPP_NUMBER=27798279327
      - NUXT_PUBLIC_WHATSAPP_DEFAULT_TEXT=Hi Our Village, I'd like to book an appointment.
    volumes:
      # Named volume is prefixed by the compose project, so staging and
      # prod-preview get separate databases automatically.
      - ourvillage_data:/data

volumes:
  ourvillage_data:
