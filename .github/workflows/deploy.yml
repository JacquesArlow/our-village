name: Deploy

# Staging only for now. Production (main) will be wired later.
on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: [self-hosted, our-village]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment
        id: env
        run: |
          # Only the staging branch triggers this workflow today, so the target
          # is fixed to staging. When production is wired, branch on github.ref
          # here (main -> production /opt/ourvillage-web, port 8090).
          echo "name=staging"                       >> "$GITHUB_OUTPUT"
          echo "dir=/opt/ourvillage-web-staging"    >> "$GITHUB_OUTPUT"
          echo "project=ourvillage-web-staging"     >> "$GITHUB_OUTPUT"
          echo "container=ourvillage-web-staging"   >> "$GITHUB_OUTPUT"
          echo "image=ourvillage-web-staging"       >> "$GITHUB_OUTPUT"
          echo "port=8093"                          >> "$GITHUB_OUTPUT"

      - name: Sync source to server
        run: |
          mkdir -p "${{ steps.env.outputs.dir }}"
          rsync -av --delete \
            --exclude='node_modules' \
            --exclude='.output' \
            --exclude='.nuxt' \
            --exclude='.cache' \
            --exclude='.git' \
            --exclude='.env' \
            "$GITHUB_WORKSPACE/" "${{ steps.env.outputs.dir }}/"

      - name: Write deploy .env from GitHub Secrets
        env:
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ADMIN_SEED_EMAIL: ${{ secrets.ADMIN_SEED_EMAIL }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          CONTACT_FROM: ${{ secrets.CONTACT_FROM }}
          BOOKING_TO: ${{ secrets.BOOKING_TO }}
        run: |
          # Secrets are the single source of truth; rewrite the env file each deploy.
          # printf '%s' with quoted vars keeps special characters intact and never
          # echoes values (GitHub also masks them in logs).
          dir="${{ steps.env.outputs.dir }}"
          umask 077
          {
            printf 'BETTER_AUTH_URL=%s\n'      "$BETTER_AUTH_URL"
            printf 'BETTER_AUTH_SECRET=%s\n'   "$BETTER_AUTH_SECRET"
            printf 'ADMIN_SEED_EMAIL=%s\n'     "$ADMIN_SEED_EMAIL"
            printf 'ADMIN_SEED_PASSWORD=%s\n'  "$ADMIN_SEED_PASSWORD"
            printf 'TURNSTILE_SECRET_KEY=%s\n' "$TURNSTILE_SECRET_KEY"
            printf 'SMTP_HOST=%s\n'            "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n'            "${SMTP_PORT:-587}"
            printf 'SMTP_USER=%s\n'            "$SMTP_USER"
            printf 'SMTP_PASS=%s\n'            "$SMTP_PASS"
            printf 'CONTACT_TO=%s\n'           "$CONTACT_TO"
            printf 'CONTACT_FROM=%s\n'         "$CONTACT_FROM"
            printf 'BOOKING_TO=%s\n'           "$BOOKING_TO"
          } > "$dir/.env"
          echo "Wrote $dir/.env ($(wc -l < "$dir/.env") vars)"

      - name: Build and restart container
        run: |
          cd "${{ steps.env.outputs.dir }}"
          export IMAGE_NAME="${{ steps.env.outputs.image }}"
          export CONTAINER_NAME="${{ steps.env.outputs.container }}"
          export HOST_PORT="${{ steps.env.outputs.port }}"
          docker compose -p "${{ steps.env.outputs.project }}" build --no-cache
          docker compose -p "${{ steps.env.outputs.project }}" down
          docker compose -p "${{ steps.env.outputs.project }}" up -d

      - name: Health check
        run: |
          # First boot runs DB migrations + auth init, so retry for up to ~30s.
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null "http://127.0.0.1:${{ steps.env.outputs.port }}"; then
              echo "✅ ${{ steps.env.outputs.name }} container is up on port ${{ steps.env.outputs.port }}"
              exit 0
            fi
            sleep 2
          done
          echo "❌ ${{ steps.env.outputs.name }} health check failed on port ${{ steps.env.outputs.port }}"
          docker compose -p "${{ steps.env.outputs.project }}" logs --tail=80 || true
          exit 1
