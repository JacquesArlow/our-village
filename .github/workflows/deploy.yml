name: Deploy

# staging branch -> staging and private live booking preview; main -> public site.
on:
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: [self-hosted, our-village]
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
            fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

          echo "Checked out $(git rev-parse --short HEAD)"

      - name: Resolve target environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "name=production"                        >> "$GITHUB_OUTPUT"
            echo "dir=/opt/ourvillage-web-prod"           >> "$GITHUB_OUTPUT"
            echo "project=ourvillage-web-prod"            >> "$GITHUB_OUTPUT"
            echo "container=ourvillage-web-prod"          >> "$GITHUB_OUTPUT"
            echo "image=ourvillage-web-prod"              >> "$GITHUB_OUTPUT"
            echo "port=8094"                              >> "$GITHUB_OUTPUT"
            echo "auth_url=https://www.our-village.co.za" >> "$GITHUB_OUTPUT"
          else
            echo "name=staging"                           >> "$GITHUB_OUTPUT"
            echo "dir=/opt/ourvillage-booking-staging"    >> "$GITHUB_OUTPUT"
            echo "project=ourvillage-web-staging"         >> "$GITHUB_OUTPUT"
            echo "container=ourvillage-web-staging"       >> "$GITHUB_OUTPUT"
            echo "image=ourvillage-booking-staging"       >> "$GITHUB_OUTPUT"
            echo "port=8093"                              >> "$GITHUB_OUTPUT"
            echo "auth_url=https://staging.our-village.co.za" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync source to server
        run: |
          mkdir -p "${{ steps.env.outputs.dir }}"
          rsync -av --delete \
            --exclude='node_modules' \
            --exclude='.output' \
            --exclude='.nuxt' \
            --exclude='.cache' \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.booking-preview' \
            "$GITHUB_WORKSPACE/" "${{ steps.env.outputs.dir }}/"

      - name: Write deploy .env from GitHub Secrets
        if: github.ref_name == 'main'
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ADMIN_SEED_EMAIL: ${{ secrets.ADMIN_SEED_EMAIL }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          CONTACT_FROM: ${{ secrets.CONTACT_FROM }}
          BOOKING_TO: ${{ secrets.BOOKING_TO }}
        run: |
          # Secrets are the single source of truth; rewrite the env file each deploy.
          # printf '%s' with quoted vars keeps special characters intact and never
          # echoes values (GitHub also masks them in logs).
          dir="${{ steps.env.outputs.dir }}"
          umask 077
          {
            printf 'BETTER_AUTH_URL=%s\n'      "${{ steps.env.outputs.auth_url }}"
            printf 'BETTER_AUTH_SECRET=%s\n'   "$BETTER_AUTH_SECRET"
            printf 'ADMIN_SEED_EMAIL=%s\n'     "$ADMIN_SEED_EMAIL"
            printf 'ADMIN_SEED_PASSWORD=%s\n'  "$ADMIN_SEED_PASSWORD"
            printf 'TURNSTILE_SECRET_KEY=%s\n' "$TURNSTILE_SECRET_KEY"
            printf 'SMTP_HOST=%s\n'            "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n'            "${SMTP_PORT:-587}"
            printf 'SMTP_USER=%s\n'            "$SMTP_USER"
            printf 'SMTP_PASS=%s\n'            "$SMTP_PASS"
            printf 'CONTACT_TO=%s\n'           "$CONTACT_TO"
            printf 'CONTACT_FROM=%s\n'         "$CONTACT_FROM"
            printf 'BOOKING_TO=%s\n'           "$BOOKING_TO"
          } > "$dir/.env"
          echo "Wrote $dir/.env ($(wc -l < "$dir/.env") vars)"

      - name: Build and restart container
        run: |
          cd "${{ steps.env.outputs.dir }}"
          export IMAGE_NAME="${{ steps.env.outputs.image }}"
          export CONTAINER_NAME="${{ steps.env.outputs.container }}"
          export HOST_PORT="${{ steps.env.outputs.port }}"
          compose_file=docker-compose.yml
          if [ "${{ github.ref_name }}" = "staging" ]; then
            compose_file=booking-app/compose.yml
            test -s .env
            grep -q '^APP_MODE=staging$' .env
          fi
          docker compose -f "$compose_file" -p "${{ steps.env.outputs.project }}" build --pull --no-cache
          docker compose -f "$compose_file" -p "${{ steps.env.outputs.project }}" up -d --remove-orphans

      - name: Health check
        run: |
          # First boot runs DB migrations + auth init, so retry for up to ~30s.
          for i in $(seq 1 15); do
            if [ "${{ github.ref_name }}" = "staging" ]; then
              if curl -sf "http://127.0.0.1:${{ steps.env.outputs.port }}/api/health" | node -e 'let data=""; process.stdin.on("data",chunk=>data+=chunk); process.stdin.on("end",()=>{try{process.exit(JSON.parse(data).app==="our-village-bookings"?0:1)}catch(e){process.exit(1)}})'; then
                echo "Booking staging health check passed."
                exit 0
              fi
              sleep 2
              continue
            fi
            if curl -sf -o /dev/null "http://127.0.0.1:${{ steps.env.outputs.port }}"; then
              echo "✅ ${{ steps.env.outputs.name }} container is up on port ${{ steps.env.outputs.port }}"
              exit 0
            fi
            sleep 2
          done
          echo "❌ ${{ steps.env.outputs.name }} health check failed on port ${{ steps.env.outputs.port }}"
          docker logs --tail=80 "${{ steps.env.outputs.container }}" || true
          exit 1

      - name: Deploy the private live booking preview
        if: github.ref_name == 'staging'
        run: |
          cd "${{ steps.env.outputs.dir }}"
          test -s .env.booking-preview
          docker compose -f booking-app/compose.preview.yml -p ourvillage-booking-preview \
            up -d --no-build --remove-orphans --wait --wait-timeout 60
